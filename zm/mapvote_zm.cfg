// Plutonium T4 Zombies Map Vote
set zmv_enable "1"
set zmv_time "20"
set zmv_result_time "5"

// Seconds to preserve the stock GAME OVER / survived rounds presentation.
set zmv_delay "4"

// Total cards including RANDOM. Valid range for stock Zombies: 3-5.
set zmv_options "3"

// 0 excludes the map just played; 1 allows it in the vote.
set zmv_allow_current "0"

// Stock World at War Zombies maps.
// nazi_zombie_prototype - Nacht der Untoten
// nazi_zombie_asylum   - Verruckt
// nazi_zombie_sumpf    - Shi No Numa
// nazi_zombie_factory  - Der Riese
set zmv_maps "nazi_zombie_prototype nazi_zombie_asylum nazi_zombie_sumpf nazi_zombie_factory"

// Starts a test vote five seconds after map load. Keep this 0 on live servers.
set zmv_debug "0"
