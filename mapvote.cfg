// T4MP Map Vote
set mv_enable "1"
set mv_time "20"
set mv_result_time "5"

// Total cards shown, including the RANDOM card. Valid range: 3-6.
// 3 means two named maps plus RANDOM; 6 means five named maps plus RANDOM.
set mv_options "3"

// 1 allows DLC maps in the named choices and RANDOM pool; 0 excludes them.
// Makin (Day) is treated as a free title-update map, not paid DLC.
set mv_allow_dlc "1"

// Space-separated playable T4 MP map IDs.
// Base/free maps:
// mp_airfield   Airfield       mp_asylum      Asylum
// mp_castle     Castle         mp_shrine      Cliffside
// mp_courtyard  Courtyard      mp_dome        Dome
// mp_downfall   Downfall       mp_hangar      Hangar
// mp_makin      Makin          mp_makin_day   Makin (Day)
// mp_outskirts  Outskirts      mp_roundhouse  Roundhouse
// mp_seelow     Seelow         mp_suburban    Upheaval
//
// DLC maps:
// mp_kneedeep   Knee Deep      mp_nachtfeuer  Nightfire
// mp_subway     Station        mp_kwai        Banzai
// mp_stalingrad Corrosion      mp_drum        Battery
// mp_bgate      Breach         mp_vodka       Revolution
// mp_docks      Sub Pens
set mv_maps "mp_airfield mp_asylum mp_castle mp_courtyard mp_dome mp_downfall mp_hangar mp_makin mp_makin_day mp_outskirts mp_roundhouse mp_seelow mp_shrine mp_suburban mp_kneedeep mp_nachtfeuer mp_subway mp_docks mp_kwai mp_stalingrad mp_drum mp_bgate mp_vodka"

// Leave empty to keep the current gametype. Example: "dm war sd dom koth"
set mv_gametypes ""

// 0 excludes the map currently being played; 1 allows it in the vote.
set mv_allow_current "0"

// Starts a preview vote five seconds after map load. Never use on a live server.
set mv_debug "0"
